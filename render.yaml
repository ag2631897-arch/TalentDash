services:
  # Python AI Pipeline Background Worker (running as a web service for free tier)
  - type: web
    name: talentdash-pipeline
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TALENTDASH_API_URL
        # Set this to your deployed Vercel URL (e.g. https://talentdash.vercel.app)
        sync: false
      - key: SCRAPE_INTERVAL_SECONDS
        value: 21600
